# 마실스펙 MBTI 16유형 — 제주 고유 소재 캐릭터 (스케치 카드 가운데 '일러스트 프롬프트' 칸)
#   motif   캐릭터 소재 (제주 상징 20선 중 16개)
#   concept 캐릭터 성격 한 줄
#   form    캐릭터 형태·동작 (그림 프롬프트)
#   scene   배경·상황 (그림 프롬프트, 대표 예시 지역 기준)
# 쓰지 않은 소재 4개(예비): 귤꽃, 백년초, 메밀꽃(15 배경에 사용), 정낭

OFYB:
  motif: 남방큰돌고래
  concept: 밝고 호기심 많은 바다 안내자
  form: 물안경을 이마에 올린 통통한 회색 돌고래가 지느러미로 버스 손잡이를 잡고 활짝 웃는 모습
  scene: 함덕 에메랄드 해변 앞 버스 정류장, 뒤로 카페 거리와 학교 운동장, 아이들이 손 흔드는 한낮
OFYW:
  motif: 제주의 바람
  concept: 장난기 많은 스피드형 바람 요정
  form: 반투명 구름 몸에 소용돌이 꼬리, 노트북을 안고 풍력발전기 날개 위에 걸터앉은 모습
  scene: 애월 해안도로 테라스 카페, 수평선 위 풍력발전기, 가족이 핫플로 향하는 노을 무렵
OFQB:
  motif: 뿔소라·보말
  concept: 소라 투구를 쓴 용감한 바닷가 지킴이
  form: 뾰족한 뿔소라 껍데기를 투구처럼 쓴 꼬마 기사가 작은 보말 친구들과 손을 잡은 모습
  scene: 쇠소깍 옆 잔잔한 포구, 고깃배 몇 척과 돌담 골목, 아이들이 바위틈 보말을 줍는 오후
OFQW:
  motif: 현무암 먹돌
  concept: 무뚝뚝해 보여도 속은 따뜻한 바위
  form: 구멍 숭숭한 둥근 검은 돌 몸, 구멍 사이로 주황빛 온기가 새어 나오고 무릎에 스케치북을 올린 모습
  scene: 하도리 철새도래지 옆 외딴 돌집 마당, 철새 나는 수평선, 가족이 각자 작업에 몰두한 고요한 아침
OSYB:
  motif: 흑돼지
  concept: 통통하고 유쾌한 로컬 미식 탐정
  form: 탐정 모자에 돋보기를 든 통통한 흑돼지가 장바구니를 들고 어르신과 나란히 걷는 모습
  scene: 서귀포 올레시장 입구와 버스 정류장, 시장 너머 바다가 보이는 골목, 북적이는 오전 장날
OSYW:
  motif: 주상절리
  concept: 규칙과 질서를 지키는 각진 암석 전사
  form: 육각 기둥 블록으로 조립된 로봇형 몸이 요가 매트와 태블릿을 들고 반듯하게 선 모습
  scene: 대포동 주상절리 해안 산책로 위 웰니스 리조트, 파도가 기둥에 부서지는 맑은 아침
OSQB:
  motif: 동백꽃
  concept: 상처를 보듬는 따뜻한 힐러
  form: 붉은 동백 꽃잎 모자를 쓴 작은 요정이 해녀 할머니 어깨에 꽃잎 담요를 덮어주는 모습
  scene: 위미리 동백 돌담 해안 안길, 테왁이 놓인 해녀탈의장과 평지 바닷길, 붉은 노을
OSQW:
  motif: 은빛 억새
  concept: 가을의 낭만을 연주하는 음유시인
  form: 은빛 억새 이삭 머리칼을 휘날리며 억새 피리를 부는 가녀린 시인, 곁에 펼쳐진 노트
  scene: 신도리 노을 해안 언덕의 억새밭, 거대한 파도와 수평선, 인적 없는 해질녘
MFYB:
  motif: 오름
  concept: 둥글둥글 포근한 언덕 요정
  form: 풀이 돋은 둥근 언덕 몸, 머리 분화구에서 김이 폴폴 나고 아이와 손잡고 숲길을 걷는 모습
  scene: 민오름 숲길 입구와 새 아파트·학교, 버스가 지나는 큰길, 상쾌한 아침 산책
MFYW:
  motif: 갈옷
  concept: 감빛 멜빵바지의 부지런한 공방 장인
  form: 감물 들인 갈옷 멜빵바지 차림으로 염색 천을 널며 한 손엔 노트북을 든 모습
  scene: 선흘 동백동산 숲속 공방 테라스, 감물 천이 바람에 나부끼는 주말 숲속 마켓
MFQB:
  motif: 조랑말
  concept: 짧은 다리로 씩씩하게 달리는 모험가
  form: 책가방을 멘 짧은 다리 조랑말이 아이들을 등에 태우고 들판을 달리는 모습
  scene: 송당리 오름 아래 숲속 분교, 목장 돌담과 넓은 초지, 흙길이 이어진 맑은 오후
MFQW:
  motif: 곶자왈
  concept: 숨골을 다루는 신비로운 숲의 정령
  form: 덩굴과 이끼로 덮인 둥근 정령, 발밑 숨골에서 하얀 김이 피어오르고 가족에게 작은 등불을 건네는 모습
  scene: 서광리 곶자왈 깊은 숲 속 독채, 암괴 위 고사리와 덩굴, 햇빛이 새어드는 고요한 오후
MSYB:
  motif: 한라산 노루
  concept: 겁은 많아도 길 안내는 척척 해내는 길잡이
  form: 큰 눈망울의 노루가 등산 스틱과 버스 카드를 들고 어르신 등산객을 앞장서 안내하는 모습
  scene: 미악산 둘레길 입구와 시내버스 정류장, 아래로 보이는 동홍동 맛집 거리, 이른 아침
MSYW:
  motif: 설문대할망
  concept: 무엇이든 빚어내는 거인 메이커
  form: 치마폭에 흙과 태블릿을 함께 담은 거인 할망, 손바닥 위에서 젊은이와 어르신이 함께 작은 오름을 빚는 모습
  scene: 영어교육도시 옆 중산간 숲세권, 숲속 공유 라운지와 오름 능선, 맑은 오후
MSQB:
  motif: 돌담·밭담
  concept: 손을 맞잡으면 태풍도 막는 퍼즐형 단짝들
  form: 검은 돌 조각들이 손을 맞잡아 굽이치는 담을 이루고, 담 위에 어르신과 고양이가 앉아 쉬는 모습
  scene: 가시리 따라비오름 아래 밭담길, 하얀 메밀꽃밭과 흙길, 바람 부는 평온한 오후
MSQW:
  motif: 한라산 백록
  concept: 뿔에 사계를 품은 우아한 신선
  form: 뿔에 봄꽃·여름잎·단풍·눈이 함께 맺힌 흰 사슴이 이끼 바위 위에서 조용히 책을 읽는 모습
  scene: 머체왓숲 고지대 안개 낀 삼나무 숲, 멀리 한라산 정상, 새벽의 정적
