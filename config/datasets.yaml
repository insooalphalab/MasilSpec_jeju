  nemc_emergency:  {provider: "국립중앙의료원",           type: api, indicators: [i04_emergency]}
  forest_oreum:    {provider: "산림청/공간정보포털",      type: shp, indicators: [i11_oreum_forest]}
  kma_weather:     {provider: "기상청 ASOS/동네예보",     type: api, indicators: [i01_odor_safety, i12_safe_road]}
  # 실제로 쓰고 있는 외부 출처
  road_centerline: {provider: "브이월드 2D 데이터 API LT_L_N3A0020000 수치지도 도로중심선 (Vworld2Ddata_API_KEY, 도로폭 rvwd·차로수 rdln)", type: api, indicators: [i12_safe_road]}
  juso_search:     {provider: "행안부 도로명주소 검색 API (JUSO_API_KEY) — 주소 검색 보조, 좌표·도로폭 없음", type: api, indicators: []}
  local_food:      {provider: "공공데이터포털 odcloud 15043695 (향토음식점, DATA_GO_KR_KEY 승인)", type: api, indicators: [i05_local_food]}
  visitjeju:       {provider: "비짓제주 OPEN API (VisitJeju_API_KEY, https만 응답)", type: api, indicators: [i05_local_food, i08_barrier_free]}
  osm_roads:       {provider: "OpenStreetMap Overpass (키 불필요)", type: json, indicators: [i03_quietness]}
  boundary:        {provider: "vuski/admdongkor 행정동 GeoJSON", type: geojson, indicators: []}
  vworld_geocode:  {provider: "브이월드 주소 좌표변환 (Vworld_API_KEY)", type: api, indicators: []}
  stores:          {provider: "소상공인 상가(상권)정보 API (B553077)", type: api, indicators: [i06_walk_drink, i07_delivery]}
  odcloud_files:   {provider: "공공데이터포털 파일→API (악취·모범·서귀포 클린하우스·해수욕장·레저·온천·심야약국·응급)", type: api, indicators: [i01_odor_safety, i02_cleanhouse, i04_emergency, i05_local_food]}
  tago_routes:     {provider: "TAGO 버스노선·경유정류소 (배차간격은 제주 0으로 비어 있음)", type: api, indicators: [i09_transit]}
  accident_std:    {provider: "전국교통사고다발지역 표준데이터 + 도로교통공단 결빙·보행노인", type: api, indicators: [i12_safe_road]}
  clinics:         {provider: "국립중앙의료원 병·의원 찾기 (진료시간 → 야간·휴일 소아)", type: api, indicators: []}
  terrain:         {provider: "AWS Terrain Tiles z12 (키 불필요)", type: png, indicators: [i08_barrier_free, i12_safe_road]}
  from_jeonbuk:    {provider: "../jyunbuk_ice 상습결빙구간·AWS 현천", type: csv, indicators: [i12_safe_road]}
