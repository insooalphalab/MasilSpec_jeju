# 데이터셋 레지스트리 (ai_agent.md §3)
# - source: hub      → 제주데이터허브. `match`(제목 부분일치)로 카탈로그(data/reference/jejudatahub_list_all.xlsx)에서 찾는다.
#                      승인 필요 여부(authYn)는 여기 적지 않고 카탈로그에서 읽는다:
#                      `python -m samchun.collect.catalog` 로 확인.
# - source: external → 타 기관 API/SHP. 수집기는 collect/external.py 에 구현.
# - indicators: 이 데이터가 들어가는 12대 지표 (config/themes.yaml 의 키)

hub:
