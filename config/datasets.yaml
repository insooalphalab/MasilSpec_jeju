  cleanhouse_seogwipo:  {match: "서귀포시_클린하우스현황",        indicators: [i02_cleanhouse]}
  odor_facility:        {match: "악취배출시설현황",               indicators: [i01_odor_safety]}
  livestock:            {match: "가축사육업 및 도축업 정보",      indicators: [i01_odor_safety]}
  noise:                {match: "제주특별자치도 환경소음측정결과", indicators: [i03_quietness]}
  er_hospital:          {match: "제주 응급실 보유 병원 정보",     indicators: [i04_emergency]}
  health_subcenter:     {match: "제주시 보건지소등현황",          indicators: [i04_emergency]}
  pork_certified:       {match: "돼지고기 판매 인증점 현황_도내", indicators: [i05_local_food]}
  model_restaurant:     {match: "모범음식점현황",                 indicators: [i05_local_food]}
  local_food:           {match: "향토음식점지정현황",             indicators: [i05_local_food]}
  google_review:        {match: "리뷰 분석 데이터",               indicators: [i05_local_food, i03_quietness]}
  safecode_visits:      {match: "안심코드 업종별 주차별 방문객",  indicators: [i06_walk_drink]}
  barrier_free:         {match: "무장애여행",                     indicators: [i08_barrier_free]}
  hayoung_olle:         {match: "하영올레 전체 코스",             indicators: [i08_barrier_free, i11_oreum_forest]}
  bus_routes_jeju:      {match: "제주시내버스노선현황",           indicators: [i09_transit]}
  beach_info:           {match: "해수욕장 정보",                  indicators: [i10_beach_leisure]}
  beach_water:          {match: "해수욕장 수질",                  indicators: [i10_beach_leisure]}
  sports_facility:      {match: "신고체육시설업",                 indicators: [i10_beach_leisure]}
  oreum_location:       {match: "오름 위치 정보",                 indicators: [i11_oreum_forest]}
  trail_closure:        {match: "등산로폐쇄구간지정현황",         indicators: [i11_oreum_forest]}
  accident_road_shape:  {match: "도로 선형별 교통사고",           indicators: [i12_safe_road]}
  accident_intersection: {match: "교차로 형태별 교통사고",        indicators: [i12_safe_road]}
  rentcar_move:         {match: "렌터카 이동 빈도",               indicators: [i03_quietness, i12_safe_road]}
  rentcar_stay:         {match: "렌터카 체류 빈도",               indicators: [i03_quietness, i06_walk_drink]}
  rentcar_spot:         {match: "렌터카 체류 거점",               indicators: [i11_oreum_forest]}
  ev_driving:           {match: "전기차 실제 운행 정보",          indicators: [i12_safe_road]}
  wifi_ap:              {match: "제주 공공와이파이 AP 정보",      indicators: []}   # 테마5 가점용 (12지표 밖)
  library:              {match: "제주 공공 도서관 정보",          indicators: []}   # 테마6 가점용
  museum:               {match: "박물관 및 미술관 위치 정보",     indicators: []}   # 테마6 가점용
  hot_spring:           {match: "온천이용현황",                   indicators: []}   # 테마7 가점용

external:
